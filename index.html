<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Carl Macapayad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/jpg" href="Images/favicon.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="#" class="logo" id="logo-initial">KC<span id="logo-lastname">Macapayad</span></a>
        <div class="menu-toggle"><i class="fa-solid fa-bars"></i></div>

        <nav>
            <a href="index.html" class="activate">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="https://www.linkedin.com/in/kim-carl-u-macapayad-432185373/" class="social-icon" target="_blank"><i class="fa-brands fa-linkedin"></i></a>    
            <a href="https://github.com/kimcarlmc" class="social-icon" target="_blank"><i class="fa-brands fa-github"></i></a>            
        </nav>
    </header>
    <section class="home">
        <div class="home-img">
            <img src="Images/main.png" alt="Profile Picture">
        </div>
        <div class="home-content">
            <h3>Hi, I'm <span>Kim Carl Macapayad</span></h3>
            <h1 class="typing-text">Computer<span> Engineer</span></h1>
            <div class="home-buttons">
                <a href="mailto:kimcarlmc@gmail.com" class="btn"><i class="fa-regular fa-envelope"></i> kimcarlmc@gmail.com</a>
                <a href="Files/KCMacapayad_Resume.pdf" class="btn" download><i class="fa-solid fa-download"></i> Download CV</a>
            </div>
        </div>
    </section>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const nav = document.querySelector('nav');

        if (menuToggle && nav) {
            menuToggle.addEventListener('click', () => {
                nav.classList.toggle('show-menu');
                const icon = menuToggle.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-xmark');
            });

            nav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => nav.classList.remove('show-menu'));
            });
        }
    </script>
</body>
</html>
